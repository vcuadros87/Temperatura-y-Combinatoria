<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencia de Calor</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
    <div class="contenedor">
        <h2>TRANSFERENCIA DE CALOR</h2>
        <br>
        <br>   
        <form onsubmit="event.preventDefault(); calcular();">
            <label for="tempInicial">T₀ — Temperatura inicial (°F)</label>
            <input type="number" id="tempInicial" placeholder="ej. 120"> 
            <label for="tempAmbiente">Ts — Temperatura del ambiente (°F)</label>
            <input type="number" id="tempAmbiente" placeholder="ej. 38"> 
            <label for="constante">k — Constante de enfriamiento</label>
            <input type="number" id="constante" placeholder="ej. 0.45" step="0.01"> 
            <label for="tiempo">t — Tiempo (horas)</label>
            <input type="number" id="tiempo" placeholder="ej. 3"> 
            <button type="submit">Calcular</button>
        </form>
        <button id="btnReset" onclick="resetear()">Realizar otro calculo</button>
        <div id="error">Por favor ingresa valores válidos.</div>
        <div id="resultado">Temperatura al tiempo: <span id="valorResultado"></span> °F</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
